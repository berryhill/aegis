name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"
  GOFLAGS: "-p=1"
  GOMAXPROCS: "2"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Test source
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v0.0.0) ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          version=${GITHUB_REF_NAME#v}
          [ "v$version" = "$GITHUB_REF_NAME" ]
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          make verify
      - name: Build release archives
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          revision=$(git rev-parse --verify HEAD^{commit})
          python3 scripts/verify-budget.py ./scripts/verify-installed-mvi.sh "$version" dist "$revision"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
