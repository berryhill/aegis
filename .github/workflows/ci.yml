name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: "go1.26.10"
  GOFLAGS: "-p=1"
  GOMAXPROCS: "2"
  GOMEMLIMIT: "512MiB"

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: make verify-repository
      - name: Classify changelog without changing source
        run: python3 scripts/verify-budget.py python3 scripts/release-readiness-mode.py . auto "999.0.${{ github.run_number }}" ""
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  go-shards:
    name: Go ${{ matrix.mode }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
        group: [api-a, api-b, implementation, orchestration, orchestration-contribution, manager, manager-contribution-repair, manager-contribution-disconnect, manager-contribution-resume, manager-contribution-restart, cli, persistence, update, remainder-a, remainder-b]
    runs-on: ubuntu-latest
    # Include toolchain setup/compilation outside the Go test-process budget.
    # All other jobs retain their existing bound; coverage is never skipped.
    timeout-minutes: ${{ matrix.mode == 'race' && (matrix.group == 'api-a' || matrix.group == 'api-b' || matrix.group == 'remainder-a') && 16 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Run complete deterministic shard
        env:
          SHARD_GROUP: ${{ matrix.group }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          set -eu
          if [ "$TEST_MODE" = race ]; then
            python3 scripts/verify-budget.py python3 scripts/verify-go-shard.py --group "$SHARD_GROUP" --race
          else
            python3 scripts/verify-budget.py python3 scripts/verify-go-shard.py --group "$SHARD_GROUP"
          fi
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  installed-proof:
    name: Release package and installed proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Package exact revision and exercise installed archives once
        run: python3 scripts/verify-budget.py ./scripts/verify-installed-mvi.sh "999.0.${{ github.run_number }}" "" "$(git rev-parse HEAD)"
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py go vet ./...
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  authority-denial-matrix:
    name: Authority denial matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py ./scripts/verify-authority-denial-matrix.sh
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Install govulncheck
        run: python3 scripts/verify-budget.py go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: python3 scripts/verify-budget.py govulncheck ./...
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  race:
    name: Race tests
    if: ${{ always() }}
    needs: [go-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every normal and race shard
        env:
          SHARDS_RESULT: ${{ needs.go-shards.result }}
        run: test "$SHARDS_RESULT" = success

  release-readiness:
    name: Exact-head release readiness
    if: ${{ always() }}
    needs: [repository-checks, go-shards, installed-proof, vet, authority-denial-matrix, vulnerability-scan, race]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all exact-head gates, including non-skipped matrix success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          assert set(results) == {'repository-checks', 'go-shards', 'installed-proof', 'vet', 'authority-denial-matrix', 'vulnerability-scan', 'race'}, results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
