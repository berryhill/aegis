name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: "go1.26.10"
  GOFLAGS: "-p=1"
  GOMAXPROCS: "2"
  GOMEMLIMIT: "512MiB"

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-version: ${{ steps.release-scope.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Read committed release scope
        id: release-scope
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('Makefile').read_text()
          versions = re.findall(r'^VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+)$', text, re.M)
          assert len(versions) == 1, 'missing or ambiguous release scope'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + versions[0] + '\n')
          PY
      - run: make verify-repository
      - name: Classify changelog without changing source
        run: python3 scripts/verify-budget.py python3 scripts/release-readiness-mode.py . auto "999.0.${{ github.run_number }}" ""
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  go-shards:
    name: Go ${{ matrix.mode }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        # Mode-specific packing: 7 normal + 13 race lanes, not 25 x 2 jobs.
        # Existing subprocess partitions/alarms remain independently enforced.
        include:
          - {mode: normal, group: api-a}
          - {mode: normal, group: api-b}
          - {mode: normal, group: implementation}
          - {mode: normal, group: orchestration}
          - {mode: normal, group: manager-a}
          - {mode: normal, group: manager-b}
          - {mode: normal, group: cli}
          - {mode: race, group: api-a}
          - {mode: race, group: api-b}
          - {mode: race, group: implementation}
          - {mode: race, group: orchestration}
          - {mode: race, group: manager-a}
          - {mode: race, group: manager-b}
          - {mode: race, group: manager-c}
          - {mode: race, group: manager-d}
          - {mode: race, group: manager-e}
          - {mode: race, group: cli-command}
          - {mode: race, group: cli}
          - {mode: race, group: support-a}
          - {mode: race, group: support-b}
    runs-on: ubuntu-latest
    # Include toolchain setup/compilation outside the Go test-process budget.
    # All other jobs retain their existing bound; coverage is never skipped.
    timeout-minutes: ${{ matrix.mode == 'race' && (matrix.group == 'api-a' || matrix.group == 'api-b' || matrix.group == 'orchestration') && 16 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Run complete deterministic shard
        env:
          SHARD_GROUP: ${{ matrix.group }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          set -eu
          if [ "$TEST_MODE" = race ]; then
            python3 scripts/verify-budget.py python3 scripts/verify-go-shard.py --bundle "$SHARD_GROUP" --race
          else
            python3 scripts/verify-budget.py python3 scripts/verify-go-shard.py --bundle "$SHARD_GROUP"
          fi
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  package-proof:
    name: Release package proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Verify v0.3.0 package profile without optional browser acceptance
        run: python3 scripts/verify-budget.py ./scripts/verify-installed-mvi.sh "0.3.0" "" "$(git rev-parse HEAD)"
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  installed-proof:
    name: Release package and installed proof
    needs: [repository-checks]
    # Owner waived this optional browser journey for exactly v0.3.0.
    # Retain a real skipped job, not a successful no-op or another Chrome run.
    if: ${{ needs.repository-checks.outputs.release-version != '0.3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Package exact revision and exercise installed archives once
        run: python3 scripts/verify-budget.py ./scripts/verify-installed-mvi.sh "999.0.${{ github.run_number }}" "" "$(git rev-parse HEAD)"
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py go vet ./...
      - name: Verify compiled canonical contribution finalization and repair
        run: |
          python3 -m unittest scripts/test_contribution_finalization_test.py
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          pool = Path(sys.argv[1]) / 'aegis-contribution-ports'
          pool.mkdir(mode=0o700)
          for port in range(8450, 8470):
              lock = pool / f'{port}.lock'
              with lock.open('x'):
                  pass
              lock.chmod(0o600)
          PY
          python3 scripts/verify-budget.py python3 scripts/acceptance_port.py --pool "$RUNNER_TEMP/aegis-contribution-ports" -- python3 scripts/test-contribution-finalization.py
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  authority-denial-matrix:
    name: Authority denial matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py ./scripts/verify-authority-denial-matrix.sh
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare exact hosted Go distribution permissions
        run: python3 scripts/prepare-ci-go-toolchain.py --goroot "$(go env GOROOT)" --version "$GO_VERSION"
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Install govulncheck
        run: python3 scripts/verify-budget.py go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: python3 scripts/verify-budget.py govulncheck ./...
      - name: Source metadata unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  race:
    name: Race tests
    if: ${{ always() }}
    needs: [go-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every normal and race shard
        env:
          SHARDS_RESULT: ${{ needs.go-shards.result }}
        run: test "$SHARDS_RESULT" = success

  release-readiness:
    name: Exact-head release readiness
    if: ${{ always() }}
    needs: [repository-checks, go-shards, package-proof, vet, authority-denial-matrix, vulnerability-scan, race]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require release eligibility gates (browser coverage reported separately)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          assert set(results) == {'repository-checks', 'go-shards', 'package-proof', 'vet', 'authority-denial-matrix', 'vulnerability-scan', 'race'}, results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
