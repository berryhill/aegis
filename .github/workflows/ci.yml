name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  format-build-test-vet:
    name: Format, build, test, and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./web)"
      - name: Verify generated console and pinned browser asset
        run: |
          python3 scripts/verify-console-vendor.py
          python3 scripts/console_security_test.py
          go generate ./web/console
          git diff --exit-code -- web/console go.mod go.sum
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./cmd/aegis
      - name: Test
        run: |
          python3 -m unittest scripts/demo_no_key_test.py
          python3 -m unittest scripts/operator_acceptance_poc_test.py
          ./scripts/verify_installed_mvi_test.sh
          python3 -m unittest scripts/verify_installed_fleet_vertical_test.py
          ./scripts/verify_release_candidate_test.sh
          ./scripts/verify-installed-mvi.sh
          go test ./...
      - name: Vet
        run: go vet ./...

  race:
    name: Race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race ./...

  authority-denial-matrix:
    name: Authority denial matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: ./scripts/verify-authority-denial-matrix.sh

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
