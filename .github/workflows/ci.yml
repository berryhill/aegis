name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  GOFLAGS: "-p=1"
  GOMAXPROCS: "2"

jobs:
  release-readiness:
    name: Exact-head release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Verify exact PR head is releasable
        run: make release-readiness VERSION="999.0.${{ github.run_number }}" SOURCE_REVISION="$(git rev-parse HEAD)"

  race:
    name: Race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py go test -race -timeout=15m ./...

  authority-denial-matrix:
    name: Authority denial matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - run: python3 scripts/verify-budget.py ./scripts/verify-authority-denial-matrix.sh

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare verification cgroup supervisor
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf "XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n" "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Install govulncheck
        run: python3 scripts/verify-budget.py go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: python3 scripts/verify-budget.py govulncheck ./...
